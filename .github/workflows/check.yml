name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Verify generated userscript is current
        run: git diff --exit-code -- askelads-warbuddy.user.js askelads-warbuddy.meta.js
